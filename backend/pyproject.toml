[project]
name = "nibble-backend"
version = "0.1.0"
requires-python = ">=3.12"

# Everything is installed up front, even things we don't use until later slices,
# so nobody gets blocked by a surprise install halfway through a task.
dependencies = [
  "fastapi>=0.115",           # the web framework
  "uvicorn[standard]>=0.32",  # the server that runs it
  "python-dotenv>=1.0",       # reads your .env file
  "python-multipart>=0.0.12", # file uploads          -> slice 1
  "pypdf>=5.1",               # pulls text out of PDFs -> slice 1
  "fastembed>=0.4",           # turns text into numbers, on your laptop -> slice 3
  "numpy>=2.0",               # compares those numbers -> slice 3
  "requests>=2.32",           # calls the Groq API      -> slice 4
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",  # runs the tests
  "ruff>=0.8",    # checks and formats the code
  "httpx2",       # pytest needs this to fake requests to our own app
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
