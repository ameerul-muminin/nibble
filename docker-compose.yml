services:
  db:
    image: pgvector/pgvector:pg16
    container_name: nibble-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: nibble
      POSTGRES_PASSWORD: nibble
      POSTGRES_DB: nibble
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nibble -d nibble"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
